kind = "mobile"
previewPath = "/"
title = "Arbaz AI"
description = "A mobile-first AI assistant for coding, math, science, writing, and technical questions in English, Hindi, and Hinglish, with voice input and speech playback."
version = "1.0.0"
id = "artifacts/arbaz-ai"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 18678

[services.development]
run = "pnpm --filter @workspace/arbaz-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/arbaz-ai", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/arbaz-ai", "run", "serve" ]

[services.env]
PORT = "18678"
BASE_PATH = "/"
